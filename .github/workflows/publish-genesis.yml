name: Prepare and publish verified Genesis components
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Approved full EvidenceGenesis commit (feat/native-game)
        required: true
        default: a5cb2e9d83114e70e8e72ff444fe2095e58573e4
      version:
        description: Independent Genesis version
        required: true
        default: 0.3.0
      sequence:
        description: Strictly increasing signed release sequence
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: genesis-public-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    environment: genesis-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SyedSU/EvidenceGenesis
          ref: ${{ inputs.source_commit }}
          path: genesis-source
          token: ${{ secrets.GENESIS_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate provenance and version
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Full source commit required' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_SEQUENCE -notmatch '^[1-9]\d*$') { throw 'Invalid release input' }
          $actual = git -C genesis-source rev-parse HEAD
          if ($LASTEXITCODE -or $actual -ne $env:SOURCE_COMMIT) { throw 'Source commit mismatch' }
          # Existing upstream builder packages 0.3.0; later versions must update the reviewed upstream builder first.
          if (!(Select-String -Path genesis-source/scripts/build_native.py -SimpleMatch "'version':'$env:RELEASE_VERSION'" -Quiet)) { throw 'Upstream version mismatch' }
      - name: Build and test real native Genesis and bundled AI
        shell: pwsh
        run: |
          python genesis-source/scripts/build_native.py
          if ($LASTEXITCODE) { throw 'Genesis build/test failed' }
      - name: Run updater tests
        run: dotnet run --project tests/UpdaterTests/UpdaterTests.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-reviewed-native-package
          path: genesis-source/build/windows/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: windows-2022
    environment: genesis-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: genesis-reviewed-native-package
          path: genesis-package
      - name: Fetch previous signed catalog for anti-replay publishing check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_WRITE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api repos/SyedSU/EvidenceNeuter-Releases/releases --paginate | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect distribution repository' }
          if ($releases | Where-Object tag_name -eq 'genesis-stable') {
            gh release download genesis-stable --repo SyedSU/EvidenceNeuter-Releases --pattern genesis-stable.json --dir previous-catalog
            if ($LASTEXITCODE) { throw 'Cannot verify previous catalog; refusing publish' }
            "PREVIOUS_RELEASE_METADATA_PATH=$((Resolve-Path previous-catalog/genesis-stable.json).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } elseif ($releases | Where-Object { $_.tag_name -like 'genesis-v*' }) { throw 'Existing Genesis releases without catalog require manual recovery' }
      - name: Package and sign approved component metadata
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.GENESIS_RELEASE_SIGNING_KEY_PEM }}
          GENESIS_RELEASE_PUBLIC_KEY_PEM: ${{ vars.GENESIS_RELEASE_PUBLIC_KEY_PEM }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
        run: |
          dotnet run --project tools/release/ReleaseTool.csproj -c Release -- genesis-package artifacts/genesis-release $env:RELEASE_VERSION $env:RELEASE_SEQUENCE $env:SOURCE_COMMIT "genesis-v$env:RELEASE_VERSION"
          if ($LASTEXITCODE) { throw 'Signing or packaging failed' }
      - name: Publish complete immutable release, then replace signed catalog locator
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_WRITE_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'SyedSU/EvidenceNeuter-Releases'
          $tag = "genesis-v$env:RELEASE_VERSION"
          $assets = (Get-ChildItem artifacts/genesis-release -File).FullName
          gh release create $tag @assets --repo $repo --draft --title "Evidence Genesis $env:RELEASE_VERSION" --notes 'Separate verified Windows x64 game, runtime and model packages. See signed genesis-stable.json.'
          if ($LASTEXITCODE) { throw 'Draft creation failed; no catalog changed' }
          gh release edit $tag --repo $repo --draft=false --latest=false
          if ($LASTEXITCODE) { throw 'Release publication failed; no catalog changed' }
          $releases = gh api repos/SyedSU/EvidenceNeuter-Releases/releases --paginate | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect catalog release' }
          if (!($releases | Where-Object tag_name -eq 'genesis-stable')) {
            gh release create genesis-stable artifacts/genesis-release/genesis-stable.json --repo $repo --title 'Genesis stable signed catalog' --notes 'Signed locator; immutable packages are referenced by release tag and digest.' --latest=false
          } else {
            gh release upload genesis-stable artifacts/genesis-release/genesis-stable.json --repo $repo --clobber
          }
          if ($LASTEXITCODE) { throw 'Catalog publication failed; previous installations remain usable' }
