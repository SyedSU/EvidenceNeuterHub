name: Legacy Genesis publisher retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy inline signing and mutable locator overwrite
        run: |
          echo 'Legacy publishing is disabled. Use EvidenceNeuter-Releases protected immutable package/metadata operations after actual signing and acceptance.'
          exit 1
